name: Hashtag United Match Recap
on:
  schedule:
    - cron: '3/10 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [check, dry-run, test-webhook, post-latest]
        default: check
      team:
        type: choice
        options: [all, men, women]
        default: all
permissions:
  contents: write
concurrency:
  group: hashtag-united-match-recap
  cancel-in-progress: false
jobs:
  run:
    if: github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install .
      - name: Run bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MODE: ${{ github.event.inputs.mode || 'check' }}
          TEAM: ${{ github.event.inputs.team || 'all' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "Running Hashtag United bot mode=$MODE team=$TEAM"
          if { [ "$MODE" = "test-webhook" ] || [ "$MODE" = "post-latest" ]; } && [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::error::DISCORD_WEBHOOK_URL repository secret is not configured. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          set +e
          if [ "$MODE" = "post-latest" ]; then
            python -m hashtag_bot.cli post-latest --team "$TEAM"
          else
            python -m hashtag_bot.cli "$MODE"
          fi
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$EVENT_NAME" = "workflow_dispatch" ] && { [ "$MODE" = "check" ] || [ "$MODE" = "dry-run" ]; }; then
            echo "::warning::Bot check could not complete, most likely because the public Football Web Pages source was unavailable or its layout changed. Manual check/dry-run runs are treated as diagnostic and will not fail the workflow; scheduled runs still fail visibly."
            exit 0
          fi
          exit "$status"
      - name: Commit state
        if: success()
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --quiet -- data/state.json; then
            echo "No state changes"
            exit 0
          fi
          git config user.name "hashtag-match-bot"
          git config user.email "actions@github.com"
          git add data/state.json
          git commit -m "chore: update match bot state [skip ci]"
          if git push origin "HEAD:$DEFAULT_BRANCH"; then
            echo "State pushed to $DEFAULT_BRANCH"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "::warning::State changed but could not be pushed. Check repository Actions write permissions or branch protection. Scheduled runs will fail visibly if this remains blocked."
          else
            echo "::error::State changed but could not be pushed. Check repository Actions write permissions or branch protection."
            exit 1
          fi
