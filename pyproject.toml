[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hashtag-united-match-recap-bot"
version = "1.0.0"
description = "Discord match recap bot for Hashtag United community"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "requests>=2.32",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "responses>=0.25", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "E701", "E702", "RUF001"]
